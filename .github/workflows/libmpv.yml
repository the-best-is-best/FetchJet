name: Package libmpv

# Runs only when asked. Packages the media player library of the native desktop app as one .gz per
# OS and uploads it to the release "libmpv-<version>" of this repository. The app downloads it the
# first time the player is opened (like ffmpeg and deno) and checks the sha256 pinned in
# sharedLogic/src/nativeDesktopMain/.../media_extractor/PlayerLibrary.nativeDesktop.kt.
# After a run, copy the sha256 printed in the job summary into PlayerLibraryPin and set VERSION.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Upstream mpv-winbuild release tag, e.g. 20261111 (must equal PlayerLibraryPin.VERSION)"
        required: true
        default: "20261111"
      windows:
        description: "Package the Windows x64 library"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  windows:
    if: ${{ inputs.windows }}
    runs-on: ${{ vars.RUNNER_WINDOWS || 'windows-latest' }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Download the upstream Windows build
        run: |
          mkdir -p work && cd work
          gh release download "$VERSION" --repo shinchiro/mpv-winbuild-cmake --pattern "mpv-dev-x86_64-$VERSION-git-*.7z" --clobber
          ls -la

      - name: Extract libmpv-2.dll
        run: |
          cd work
          ARCHIVE="$(ls mpv-dev-x86_64-"$VERSION"-git-*.7z | head -1)"
          if command -v 7z >/dev/null 2>&1; then
            7z e -y "$ARCHIVE" libmpv-2.dll >/dev/null
          elif [ -x "/c/Program Files/7-Zip/7z.exe" ]; then
            "/c/Program Files/7-Zip/7z.exe" e -y "$ARCHIVE" libmpv-2.dll >/dev/null
          else
            tar -xf "$ARCHIVE" libmpv-2.dll
          fi
          test -s libmpv-2.dll
          ls -la libmpv-2.dll

      - name: Compress
        run: |
          cd work
          gzip -9nc libmpv-2.dll > "libmpv-windows-x64-$VERSION.gz"
          sha256sum "libmpv-windows-x64-$VERSION.gz" | tee sha256.txt
          ls -la

      - name: Upload to the release libmpv-${{ inputs.version }}
        run: |
          cd work
          TAG="libmpv-$VERSION"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "libmpv $VERSION" \
              --notes "Media player library for the native desktop app, downloaded by the app on first use." --latest=false
          fi
          gh release upload "$TAG" "libmpv-windows-x64-$VERSION.gz" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Summary
        run: |
          {
            echo "### libmpv $VERSION (Windows x64)"
            echo
            echo "Put this in PlayerLibraryPin.WINDOWS_X64_SHA256:"
            echo
            echo '```'
            cut -d' ' -f1 work/sha256.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
