name: Build FetchJet

# Builds on every push to master; a version tag (git tag v1.0.0 && git push --tags) additionally
# creates a draft GitHub Release with all installers attached.
on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Android Keystore
        env:
          SIGNING_KEY_STORE_BASE64: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEY_STORE_BASE64" ]; then
            mkdir -p keys
            echo "$SIGNING_KEY_STORE_BASE64" | base64 --decode > keys/tbib.jks
          fi

      # yt-dlp for Android is git-ignored (binary); fetch the official release so the APK
      # built from a clean checkout has a working media engine.
      - name: Bundle yt-dlp into the Android app
        run: |
          mkdir -p androidApp/src/main/assets androidApp/src/main/res/raw
          curl -fsSL -o androidApp/src/main/assets/ytdlp https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp
          cp androidApp/src/main/assets/ytdlp androidApp/src/main/res/raw/ytdlp
          ls -la androidApp/src/main/assets/ytdlp

      - name: Build Android Release APK and Bundle
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: ./gradlew :androidApp:assembleRelease :androidApp:bundleRelease

      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: |
            androidApp/build/outputs/apk/release/*.apk
            androidApp/build/outputs/apk/release/**/*.apk

      - name: Upload Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: android-release-bundle
          path: androidApp/build/outputs/bundle/release/*.aab

  build-desktop-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Linux Deb & AppImage
        run: ./gradlew :desktopApp:packageDeb :desktopApp:packageAppImage

      - name: Pack the app-image directory
        run: |
          # Compose writes the jpackage app-image to binaries/main/app/<Name>
          cd desktopApp/build/compose/binaries/main/app
          tar czf ../FetchJet-linux-x64.tar.gz .

      - name: Upload Linux DEB Package
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-deb
          path: desktopApp/build/compose/binaries/main/deb/*.deb

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-appimage
          path: desktopApp/build/compose/binaries/main/FetchJet-linux-x64.tar.gz

  build-desktop-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Windows EXE & MSI
        run: ./gradlew :desktopApp:packageExe :desktopApp:packageMsi

      - name: Upload Windows EXE Installer
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-exe
          path: desktopApp/build/compose/binaries/main/exe/*.exe

      - name: Upload Windows MSI Installer
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-msi
          path: desktopApp/build/compose/binaries/main/msi/*.msi

  build-desktop-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build macOS DMG
        run: ./gradlew :desktopApp:packageDmg

      - name: Upload macOS DMG Installer
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-dmg
          path: desktopApp/build/compose/binaries/main/dmg/*.dmg

  # Unsigned .ipa of the FULL edition for GitHub Releases (sideload via AltStore/Sideloadly).
  # The App Store build (FETCHJET_EDITION=store) is archived and uploaded from Xcode with
  # your signing identity; it is not produced here.
  build-ios-ipa:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install native build tools (cmake, boost for libtorrent)
        run: brew install cmake boost

      # Python.xcframework (BeeWare) is downloaded and LibTorrent.xcframework is compiled from
      # source by scripts/ios-prepare-frameworks.sh. libtorrent takes ~20 min, so cache the result
      # keyed on the scripts that produce it.
      - name: Cache native frameworks
        id: native-cache
        uses: actions/cache@v4
        with:
          path: iosApp/Frameworks
          key: ios-native-frameworks-${{ runner.os }}-${{ hashFiles('scripts/ios-prepare-frameworks.sh', 'scripts/build-libtorrent-ios.command') }}

      - name: Prepare native frameworks (Python runtime + libtorrent)
        run: ./scripts/ios-prepare-frameworks.sh

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project iosApp/iosApp.xcodeproj -scheme iosApp -skipPackagePluginValidation

      - name: Build unsigned IPA (full edition)
        run: ./scripts/build-ios-ipa.sh full

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-full-ipa
          path: build/ios/FetchJet-full.ipa

      - name: Upload iOS build logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: |
            build/*.log
            build/*.errors.txt
          if-no-files-found: ignore

  # Browser extension: Chrome/Edge zip + Firefox xpi. The Firefox file is signed on AMO when
  # the AMO_JWT_ISSUER / AMO_JWT_SECRET secrets exist (addons.mozilla.org -> Tools -> Manage API keys);
  # otherwise the unsigned xpi is uploaded (installable on Developer Edition / Nightly only).
  build-extension:
    runs-on: ubuntu-latest
    # `secrets` cannot be read inside a step `if:`; expose it as env and test that instead.
    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package Chrome and Firefox builds
        run: ./extension/build.sh

      - name: Sign Firefox extension on AMO (if keys are configured)
        if: ${{ env.AMO_JWT_ISSUER != '' }}
        run: |
          npx --yes web-ext@8 sign --channel unlisted --source-dir build/extension/firefox \
            --artifacts-dir build/extension/signed --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"
          rm -f build/extension/*.xpi
          cp build/extension/signed/*.xpi build/extension/

      - name: Upload extension packages
        uses: actions/upload-artifact@v4
        with:
          name: browser-extension
          path: |
            build/extension/*.zip
            build/extension/*.xpi

  release:
    needs: [ build-android, build-desktop-linux, build-desktop-windows, build-desktop-macos, build-ios-ipa, build-extension ]
    runs-on: ubuntu-latest
    # Publish only for version tags (git tag v1.0.1 && git push --tags), as a draft you review.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The in-app update check compares the release tag with APP_VERSION: they must match,
      # or users of the new build would be told about an "update" to the version they have.
      - name: Check the tag matches APP_VERSION
        run: |
          APP_VERSION=$(sed -n 's/^const val APP_VERSION = "\(.*\)"/\1/p' sharedLogic/src/commonMain/kotlin/com/michelle/raouf/fetch_jet/core/update/AppVersion.kt)
          TAG="${GITHUB_REF_NAME#v}"
          echo "tag=$TAG app=$APP_VERSION"
          if [ "$TAG" != "$APP_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match APP_VERSION $APP_VERSION in AppVersion.kt"
            exit 1
          fi

      - name: Download all workflow artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release (draft) and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android-release-apk/**/*.apk
            desktop-linux-deb/*.deb
            desktop-linux-appimage/*.tar.gz
            desktop-windows-exe/*.exe
            desktop-windows-msi/*.msi
            desktop-macos-dmg/*.dmg
            ios-full-ipa/*.ipa
            browser-extension/*.zip
            browser-extension/*.xpi
          tag_name: ${{ github.ref_name }}
          name: "FetchJet ${{ github.ref_name }}"
          generate_release_notes: true
          draft: true
          prerelease: false
