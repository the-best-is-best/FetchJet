name: Build FetchJet

# Runs only when asked (the runners are your own machines, so nothing builds on every push):
#  - RELEASE: push a tag (git tag v1.0.2 && git push --tags) = all platforms, or
#    Actions -> "Build FetchJet" -> Run workflow, type the version and tick only the platforms
#    that changed. Unticked platforms are listed in the notes as unchanged (the app then tells
#    those users there is nothing new). "beta" lists the beta platforms (ios, linux, ... or all):
#    the downloads page marks those builds Beta. The result is a DRAFT release you review and publish.
#    Each build job uploads its files straight to the draft release (no workflow artifacts,
#    so the account's artifact storage quota is never hit).
#  - VERIFY: Run workflow with the version left empty = compile and package everything,
#    publish nothing.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version, e.g. 1.0.2 (must equal APP_VERSION). Empty = verify only, no release."
        required: false
        default: ""
      beta:
        description: "Beta platforms, e.g. ios or ios,linux or all. Empty = all stable. Users still get the update."
        required: false
        default: ""
      android:
        description: "Android (APKs)"
        type: boolean
        default: true
      windows:
        description: "Windows (MSI + Store MSIX; jvm also EXE)"
        type: boolean
        default: true
      macos:
        description: "macOS (DMG)"
        type: boolean
        default: true
      linux:
        description: "Linux (DEB + portable .tar.gz)"
        type: boolean
        default: true
      ios:
        description: "iOS (IPA, full edition)"
        type: boolean
        default: true
      extension:
        description: "Browser extension (Chrome zip + Firefox xpi)"
        type: boolean
        default: true
      stores:
        description: "Submit the extension to the Firefox / Edge stores (off = sign it unlisted and attach the .xpi to the release instead)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  # Diagnostic logging in the built apps. Flip the repository variable
  # (Settings -> Secrets and variables -> Actions -> Variables) FETCHJET_VERBOSE_LOGS to true
  # for a build that logs torrent/engine details; unset = off.
  FETCHJET_VERBOSE_LOGS: ${{ vars.FETCHJET_VERBOSE_LOGS || 'false' }}

jobs:
  # Decides the mode and the platform list; every other job reads these outputs.
  plan:
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      beta: ${{ steps.plan.outputs.beta }}
      android: ${{ steps.plan.outputs.android }}
      windows: ${{ steps.plan.outputs.windows }}
      macos: ${{ steps.plan.outputs.macos }}
      linux: ${{ steps.plan.outputs.linux }}
      ios: ${{ steps.plan.outputs.ios }}
      extension: ${{ steps.plan.outputs.extension }}
      stores: ${{ steps.plan.outputs.stores }}
      desktop_engine: ${{ steps.plan.outputs.desktop_engine }}
    steps:
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          IN_VERSION: ${{ inputs.release_version }}
          IN_ANDROID: ${{ inputs.android }}
          IN_WINDOWS: ${{ inputs.windows }}
          IN_MACOS: ${{ inputs.macos }}
          IN_LINUX: ${{ inputs.linux }}
          IN_IOS: ${{ inputs.ios }}
          IN_EXTENSION: ${{ inputs.extension }}
          IN_STORES: ${{ inputs.stores }}
          IN_BETA: ${{ inputs.beta }}
          IN_ENGINE: ${{ inputs.desktop_engine }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tag pushes have no inputs: they build the native desktop app.
          case "${IN_ENGINE:-native}" in
            native) echo "desktop_engine=native" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::desktop_engine must be native, not '$IN_ENGINE'"; exit 1 ;;
          esac
          # "iOS, Linux" -> "ios,linux"; anything that is not a known platform is dropped.
          BETA=""
          for p in $(echo "$IN_BETA" | tr 'A-Z,' 'a-z '); do
            case "$p" in all|android|windows|macos|linux|ios|extension) BETA="${BETA:+$BETA,}$p" ;; esac
          done
          echo "beta=$BETA" >> "$GITHUB_OUTPUT"
          if [[ "$REF" == refs/tags/v* ]] && gh release view "${REF#refs/tags/}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Publishing a draft creates its tag: that push must not rebuild the release.
            echo "Release ${REF#refs/tags/} already exists: nothing to build."
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            for p in android windows macos linux ios extension stores; do echo "$p=false" >> "$GITHUB_OUTPUT"; done
          elif [[ "$REF" == refs/tags/v* ]]; then
            # tag push: release everything
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "version=${REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
            for p in android windows macos linux ios extension stores; do echo "$p=true" >> "$GITHUB_OUTPUT"; done
          elif [[ "$EVENT" == "workflow_dispatch" && -n "$IN_VERSION" ]]; then
            # manual release of the ticked platforms only
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "version=${IN_VERSION#v}" >> "$GITHUB_OUTPUT"
            echo "android=$IN_ANDROID" >> "$GITHUB_OUTPUT"
            echo "windows=$IN_WINDOWS" >> "$GITHUB_OUTPUT"
            echo "macos=$IN_MACOS" >> "$GITHUB_OUTPUT"
            echo "linux=$IN_LINUX" >> "$GITHUB_OUTPUT"
            echo "ios=$IN_IOS" >> "$GITHUB_OUTPUT"
            echo "extension=$IN_EXTENSION" >> "$GITHUB_OUTPUT"
            echo "stores=${IN_STORES:-true}" >> "$GITHUB_OUTPUT"
          else
            # verify: build everything, publish nothing
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            for p in android windows macos linux ios extension; do echo "$p=true" >> "$GITHUB_OUTPUT"; done
            echo "stores=false" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: steps.plan.outputs.release == 'true'
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN }}

      # The in-app update check compares the release tag with APP_VERSION: they must match,
      # or users of the new build would be told about an "update" to the version they have.
      - name: Check the version matches APP_VERSION
        if: steps.plan.outputs.release == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          APP_VERSION=$(tr -d '\r' < sharedLogic/src/commonMain/kotlin/com/michelle/raouf/fetch_jet/core/update/AppVersion.kt | sed -n 's/^const val APP_VERSION = "\(.*\)"/\1/p')
          echo "release=$VERSION app=$APP_VERSION"
          if [ "$VERSION" != "$APP_VERSION" ]; then
            echo "::error::Release version $VERSION does not match APP_VERSION $APP_VERSION in AppVersion.kt"
            exit 1
          fi

      # The build jobs upload their files into this draft as they finish.
      - name: Create the draft release
        if: steps.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.plan.outputs.version }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG exists: files will be replaced."
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
              --title "FetchJet $TAG" --notes "Building…"
          fi

  build-android:
    needs: plan
    if: needs.plan.outputs.android == 'true'
    # RUNNER_ANDROID = win-host builds it on your Windows PC (see scripts/setup-windows-runner.ps1).
    runs-on: ${{ vars.RUNNER_ANDROID || 'ubuntu-latest' }}
    # The signing secrets are stored in the "release-build" environment (Settings -> Environments).
    environment: release-build
    # Git Bash on a Windows runner, so the same scripts work there and on Linux.
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Android Keystore
        env:
          SIGNING_KEY_STORE_BASE64: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEY_STORE_BASE64" ]; then
            mkdir -p keys
            echo "$SIGNING_KEY_STORE_BASE64" | base64 --decode > keys/tbib.jks
          fi

      # yt-dlp for Android is git-ignored (binary); fetch the official release so the APK
      # built from a clean checkout has a working media engine.
      - name: Bundle yt-dlp into the Android app
        run: |
          mkdir -p androidApp/src/main/assets androidApp/src/main/res/raw
          curl -fsSL -o androidApp/src/main/assets/ytdlp https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp
          cp androidApp/src/main/assets/ytdlp androidApp/src/main/res/raw/ytdlp
          ls -la androidApp/src/main/assets/ytdlp

      - name: Build Android Release APK and Bundle
        env:
          # The alias is saved as an environment *variable*, the rest as secrets.
          SIGNING_KEY_ALIAS: ${{ vars.SIGNING_KEY_ALIAS || secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        # The .aab (Google Play) is not built: Play rejects apps that download from YouTube-like
        # sites, so FetchJet is distributed as APKs. To bring it back add a second Gradle run,
        # ":androidApp:bundleRelease" (AGP cannot build APKs with ABI splits and the bundle in
        # one run), and "*.aab" to the upload list below.
        run: |
          GRADLE=./gradlew; [ "$RUNNER_OS" = "Windows" ] && GRADLE=./gradlew.bat
          $GRADLE :androidApp:assembleRelease

      - name: Upload Android to the draft release
        if: needs.plan.outputs.release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          TAG: v${{ needs.plan.outputs.version }}
        run: |
          shopt -s nullglob   # (no globstar: macOS ships bash 3.2)
          # Only the CPUs real devices have: arm64 (nearly every phone), armeabi-v7a (old phones),
          # x86_64 (emulators, Chromebooks) and the universal APK.
          FILES=()
          for f in androidApp/build/outputs/apk/release/*.apk androidApp/build/outputs/apk/release/*/*.apk; do
            case "$f" in *arm64-v8a*|*armeabi-v7a*|*x86_64*|*universal*) FILES+=("$f");; esac
          done
          [ ${#FILES[@]} -gt 0 ] || { echo "::error::No Android files were produced"; exit 1; }
          # Every file gets <file>.sig: the in-app updater installs only signed files.
          bash scripts/sign-release-file.sh "${FILES[@]}"
          SIGS=(); for f in "${FILES[@]}"; do SIGS+=("$f.sig"); done; FILES+=("${SIGS[@]}")
          pids=(); for f in "${FILES[@]}"; do gh release upload "$TAG" "$f" --clobber --repo "$GITHUB_REPOSITORY" & pids+=($!); done
          for p in "${pids[@]}"; do wait "$p"; done


  build-desktop-linux:
    needs: plan
    if: needs.plan.outputs.linux == 'true'
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    env:
      SLINT_LINUX_SDK_URL: ${{ vars.FETCHJET_SLINT_LINUX_SDK_URL || 'https://github.com/slint-ui/slint/releases/download/v1.18.1/Slint-cpp-1.18.1-Linux-x86_64.tar.gz' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check native build packages
        if: needs.plan.outputs.desktop_engine == 'native'
        run: |
          PKGS="build-essential cmake git dpkg-dev libfontconfig1-dev libfreetype-dev libxkbcommon-dev libinput-dev libudev-dev libgbm-dev libcurl4-openssl-dev libssl-dev libboost-dev"
          MISSING=()
          for p in $PKGS; do dpkg -s "$p" >/dev/null 2>&1 || MISSING+=("$p"); done
          if [ ${#MISSING[@]} -gt 0 ]; then
            if sudo -n true 2>/dev/null; then
              sudo apt-get update -y && sudo apt-get install -y --no-install-recommends "${MISSING[@]}"
            else
              echo "::error::Missing: ${MISSING[*]}. On the runner machine run once: sudo apt-get install -y ${MISSING[*]}"
              exit 1
            fi
          fi

      - name: Slint C++ SDK (Linux)
        if: needs.plan.outputs.desktop_engine == 'native'
        run: |
          rm -rf "$RUNNER_TEMP/slint-dl" "$RUNNER_TEMP/slint"
          mkdir -p "$RUNNER_TEMP/slint-dl" "$RUNNER_TEMP/slint"
          curl -4 --retry 3 -fsSL -o "$RUNNER_TEMP/slint-dl/slint.tar.gz" "$SLINT_LINUX_SDK_URL"
          tar -xzf "$RUNNER_TEMP/slint-dl/slint.tar.gz" -C "$RUNNER_TEMP/slint-dl"
          cfg="$(find "$RUNNER_TEMP/slint-dl" -name SlintConfig.cmake -print -quit)"
          [ -n "$cfg" ] || { echo "::error::no SlintConfig.cmake in the Slint SDK"; exit 1; }
          root="$(cd "$(dirname "$cfg")/../../.." && pwd)"
          cp -a "$root/." "$RUNNER_TEMP/slint/"
          [ -f "$RUNNER_TEMP/slint/lib/libslint_cpp.so" ] || { echo "::error::Slint SDK has no lib/libslint_cpp.so"; exit 1; }

      - name: Cache libtorrent sources
        if: needs.plan.outputs.desktop_engine == 'native'
        uses: actions/cache@v4
        with:
          path: ~/.cache/fetchjet-libtorrent
          key: fetchjet-libtorrent-src-6da363d

      # libtorrent 2.1.2, the commit desktopNative/torrent/build-mac.sh pins.
      - name: Torrent library (libfjtorrent.so)
        if: needs.plan.outputs.desktop_engine == 'native'
        run: |
          set -e
          LT="$HOME/.cache/fetchjet-libtorrent/libtorrent-6da363d"
          if [ ! -f "$LT/CMakeLists.txt" ]; then
            rm -rf "$LT"; mkdir -p "$LT"
            git -C "$LT" init -q
            git -C "$LT" remote add origin https://github.com/arvidn/libtorrent.git
            git -C "$LT" fetch -q --depth 1 origin 6da363d2994f17c0b3c0450d124cf73a31a73847
            git -C "$LT" checkout -q FETCH_HEAD
            git -C "$LT" submodule update -q --init --recursive --depth 1
          fi
          cmake -S desktopNative/torrent -B "$RUNNER_TEMP/torrent-build" -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release \
            -DLIBTORRENT_SOURCE_DIR="$LT" -DBUILD_SHARED_LIBS=OFF -Ddeprecated-functions=OFF -Dwebtorrent=OFF \
            -Dbuild_tests=OFF -Dbuild_examples=OFF -Dbuild_tools=OFF -Dpython-bindings=OFF
          cmake --build "$RUNNER_TEMP/torrent-build" -j"$(nproc)" --target fjtorrent
          [ -f "$RUNNER_TEMP/torrent-build/libfjtorrent.so" ] || { echo "::error::libfjtorrent.so was not built"; exit 1; }

      - name: Release core (libfjcore.so)
        if: needs.plan.outputs.desktop_engine == 'native'
        run: ./gradlew :desktopNativeCore:linkReleaseSharedLinuxX64 -Pfetchjet.nativeDesktop=true

      - name: Release host (FetchJet)
        if: needs.plan.outputs.desktop_engine == 'native'
        run: |
          rm -rf desktopNative/build-linux
          cmake -S desktopNative -B desktopNative/build-linux -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release \
            -DSLINT_DIR="$RUNNER_TEMP/slint" -DFJ_CORE_KIND=releaseShared
          cmake --build desktopNative/build-linux -j"$(nproc)"

      - name: Portable folder and .deb
        if: needs.plan.outputs.desktop_engine == 'native'
        env:
          FJ_HOST_BUILD: ${{ github.workspace }}/desktopNative/build-linux
          FJ_SLINT_DIR: ${{ runner.temp }}/slint
          FJ_TORRENT_SO: ${{ runner.temp }}/torrent-build/libfjtorrent.so
          FJ_PACKAGE_OUT: ${{ runner.temp }}/package
        run: |
          rm -rf "$FJ_PACKAGE_OUT"
          bash desktopNative/packaging/linux/build-linux.sh
          tar -tzf "$FJ_PACKAGE_OUT"/FetchJet-*-linux-x64.tar.gz | grep -q '/libfjtorrent.so$' || { echo "::error::libfjtorrent.so is not in the .tar.gz"; exit 1; }

      - name: Upload the .tar.gz and .deb (verify run, workflow artifact)
        if: needs.plan.outputs.release != 'true' && needs.plan.outputs.desktop_engine == 'native'
        uses: actions/upload-artifact@v4
        with:
          name: fetchjet-linux-native
          path: |
            ${{ runner.temp }}/package/FetchJet-*-linux-x64.tar.gz
            ${{ runner.temp }}/package/fetchjet_*_amd64.deb
          if-no-files-found: error
          retention-days: 7

      - name: Upload Linux to the draft release
        if: needs.plan.outputs.release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          TAG: v${{ needs.plan.outputs.version }}
          ENGINE: ${{ needs.plan.outputs.desktop_engine }}
        run: |
          shopt -s nullglob   # (no globstar: macOS ships bash 3.2)
          FILES=( "$RUNNER_TEMP"/package/fetchjet_*_amd64.deb "$RUNNER_TEMP"/package/FetchJet-*-linux-x64.tar.gz )
          [ ${#FILES[@]} -gt 0 ] || { echo "::error::No Linux files were produced"; exit 1; }
          # Every file gets <file>.sig: the in-app updater installs only signed files.
          bash scripts/sign-release-file.sh "${FILES[@]}"
          SIGS=(); for f in "${FILES[@]}"; do SIGS+=("$f.sig"); done; FILES+=("${SIGS[@]}")
          pids=(); for f in "${FILES[@]}"; do gh release upload "$TAG" "$f" --clobber --repo "$GITHUB_REPOSITORY" & pids+=($!); done
          for p in "${pids[@]}"; do wait "$p"; done


  build-desktop-windows:
    needs: plan
    if: needs.plan.outputs.windows == 'true'
    # RUNNER_WINDOWS = win-host builds it on your Windows PC (see scripts/setup-windows-runner.ps1).
    runs-on: ${{ vars.RUNNER_WINDOWS || 'windows-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Native build tools (drive E, Slint, CMake, WiX, Windows SDK, MSYS2 clang64, libtorrent)
        if: needs.plan.outputs.desktop_engine == 'native'
        shell: cmd
        env:
          SLINT_SDK_URL: ${{ vars.FETCHJET_SLINT_SDK_URL }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File desktopNative\packaging\ci-windows.ps1 -Step prepare

      - name: Torrent library (fjtorrent.dll)
        if: needs.plan.outputs.desktop_engine == 'native'
        shell: cmd
        env:
          FJT_BUILD_DIR: ${{ github.workspace }}\desktopNative\torrent\build
        run: call desktopNative\torrent\build.cmd --target fjtorrent

      - name: Release core (fjcore.dll)
        if: needs.plan.outputs.desktop_engine == 'native'
        shell: cmd
        run: call .\gradlew.bat :desktopNativeCore:linkReleaseSharedMingwX64 -Pfetchjet.nativeDesktop=true

      - name: Release host (FetchJet.exe)
        if: needs.plan.outputs.desktop_engine == 'native'
        shell: cmd
        run: |
          if exist desktopNative\build-release rmdir /s /q desktopNative\build-release
          cmake -S desktopNative -B desktopNative\build-release -A x64 -DFJ_CORE_KIND=releaseShared -DSLINT_DIR=E:/tools/slint || exit /b 1
          cmake --build desktopNative\build-release --config Release -- /nodeReuse:false || exit /b 1

      - name: Stage, MSI, MSIX (checked)
        if: needs.plan.outputs.desktop_engine == 'native'
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File desktopNative\packaging\ci-windows.ps1 -Step package

      - name: Upload MSI, MSIX and stage zip (verify run, workflow artifact)
        if: needs.plan.outputs.release != 'true' && needs.plan.outputs.desktop_engine == 'native'
        uses: actions/upload-artifact@v4
        with:
          name: fetchjet-windows-native
          path: |
            E:/tools/probes/package/ci/out/FetchJet-*.msi
            E:/tools/probes/package/ci/out/FetchJet-*.msix
            E:/tools/probes/package/ci/out/FetchJet-*-native-stage.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload Windows to the draft release
        if: needs.plan.outputs.release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          TAG: v${{ needs.plan.outputs.version }}
          ENGINE: ${{ needs.plan.outputs.desktop_engine }}
        run: |
          shopt -s nullglob   # (no globstar: macOS ships bash 3.2)
            # No .exe: the updater (JVM and native) takes the first .msi; the stage zip stays a workflow artifact.
          FILES=( /e/tools/probes/package/ci/out/FetchJet-*.msi /e/tools/probes/package/ci/out/FetchJet-*-store.msix )
          [ ${#FILES[@]} -gt 0 ] || { echo "::error::No Windows files were produced"; exit 1; }
          # Every file gets <file>.sig: the in-app updater installs only signed files.
          bash scripts/sign-release-file.sh "${FILES[@]}"
          SIGS=(); for f in "${FILES[@]}"; do SIGS+=("$f.sig"); done; FILES+=("${SIGS[@]}")
          pids=(); for f in "${FILES[@]}"; do gh release upload "$TAG" "$f" --clobber --repo "$GITHUB_REPOSITORY" & pids+=($!); done
          for p in "${pids[@]}"; do wait "$p"; done


  build-desktop-macos:
    needs: plan
    if: needs.plan.outputs.macos == 'true'
    # RUNNER_MACOS = mac-host builds it on your own Mac (see scripts/setup-macos-runner.sh).
    runs-on: ${{ vars.RUNNER_MACOS || 'macos-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Native build tools (cmake, boost for libtorrent)
        if: needs.plan.outputs.desktop_engine == 'native'
        run: |
          if ! brew list cmake >/dev/null 2>&1 || ! brew list boost >/dev/null 2>&1; then brew install cmake boost; fi

      - name: Slint C++ SDK (macOS)
        if: needs.plan.outputs.desktop_engine == 'native'
        env:
          SLINT_MAC_SDK_URL: ${{ vars.FETCHJET_SLINT_MAC_SDK_URL || 'https://github.com/slint-ui/slint/releases/download/v1.18.1/Slint-cpp-1.18.1-Darwin-arm64.tar.gz' }}
        run: |
          rm -rf "$RUNNER_TEMP/slint-dl" "$RUNNER_TEMP/slint"
          mkdir -p "$RUNNER_TEMP/slint-dl" "$RUNNER_TEMP/slint"
          curl -4 --retry 3 -fsSL -o "$RUNNER_TEMP/slint-dl/slint.tar.gz" "$SLINT_MAC_SDK_URL"
          tar -xzf "$RUNNER_TEMP/slint-dl/slint.tar.gz" -C "$RUNNER_TEMP/slint-dl"
          cfg="$(find "$RUNNER_TEMP/slint-dl" -name SlintConfig.cmake -print -quit)"
          [ -n "$cfg" ] || { echo "::error::no SlintConfig.cmake in the Slint SDK"; exit 1; }
          root="$(cd "$(dirname "$cfg")/../../.." && pwd)"
          cp -a "$root/." "$RUNNER_TEMP/slint/"
          [ -f "$RUNNER_TEMP/slint/lib/libslint_cpp.dylib" ] || { echo "::error::Slint SDK has no lib/libslint_cpp.dylib"; exit 1; }
          echo "FJ_SLINT_DIR=$RUNNER_TEMP/slint" >> "$GITHUB_ENV"

      # libtorrent sources + static OpenSSL (build-mac.sh keeps them here); the library itself is rebuilt.
      - name: Cache libtorrent sources and OpenSSL
        if: needs.plan.outputs.desktop_engine == 'native'
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/fetchjet-libtorrent
          key: fetchjet-libtorrent-macos-${{ hashFiles('desktopNative/torrent/build-mac.sh') }}

      - name: Torrent library (libfjtorrent.dylib)
        if: needs.plan.outputs.desktop_engine == 'native'
        run: |
          rm -rf desktopNative/torrent/build-mac
          bash desktopNative/torrent/build-mac.sh

      - name: Build macOS DMG (native, Apple Silicon)
        if: needs.plan.outputs.desktop_engine == 'native'
        env:
          FJ_HOST_BUILD: ${{ github.workspace }}/desktopNative/build-mac
          FJ_PACKAGE_OUT: ${{ github.workspace }}/desktopNative/build-mac/package
        run: |
          set -e
          rm -rf "$FJ_HOST_BUILD"
          bash desktopNative/packaging/mac/make-dmg.sh
          shopt -s nullglob
          DMGS=( "$FJ_PACKAGE_OUT"/FetchJet-*-arm64.dmg )
          [ ${#DMGS[@]} -eq 1 ] || { echo "::error::expected one FetchJet-<version>-arm64.dmg, found ${#DMGS[@]}"; exit 1; }
          f="${DMGS[0]}"
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$f" >/dev/null
          bin="$mnt/FetchJet.app/Contents/MacOS"
          id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$mnt/FetchJet.app/Contents/Info.plist" 2>/dev/null || true)
          arch=$(lipo -archs "$bin/FetchJet" 2>/dev/null || true)
          core=$(lipo -archs "$bin/libfjcore.dylib" 2>/dev/null || true)
          torrent=$(lipo -archs "$bin/libfjtorrent.dylib" 2>/dev/null || true)
          hdiutil detach "$mnt" >/dev/null
          echo "bundle id '$id', FetchJet '$arch', libfjcore '$core', libfjtorrent '$torrent'"
          [ "$id" = "com.michelle.raouf.fetch_jet" ] || { echo "::error::bundle id is '$id', not com.michelle.raouf.fetch_jet (the JVM app's id)"; exit 1; }
          [ "$arch" = "arm64" ] && [ "$core" = "arm64" ] || { echo "::error::$f is not arm64 (FetchJet '$arch', libfjcore '$core')"; exit 1; }
          [ "$torrent" = "arm64" ] || { echo "::error::libfjtorrent.dylib is missing or not arm64: torrents would be hidden"; exit 1; }
          ls -la "$FJ_PACKAGE_OUT"

      - name: Upload the DMG (verify run, workflow artifact)
        if: needs.plan.outputs.release != 'true' && needs.plan.outputs.desktop_engine == 'native'
        uses: actions/upload-artifact@v4
        with:
          name: fetchjet-macos-native
          path: desktopNative/build-mac/package/FetchJet-*-arm64.dmg
          if-no-files-found: error
          retention-days: 7

      - name: Upload macOS to the draft release
        if: needs.plan.outputs.release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          TAG: v${{ needs.plan.outputs.version }}
          ENGINE: ${{ needs.plan.outputs.desktop_engine }}
        run: |
          shopt -s nullglob   # (no globstar: macOS ships bash 3.2)
          FILES=( desktopNative/build-mac/package/FetchJet-*-arm64.dmg )
          [ ${#FILES[@]} -gt 0 ] || { echo "::error::No macOS files were produced"; exit 1; }
          # Every file gets <file>.sig: the in-app updater installs only signed files.
          bash scripts/sign-release-file.sh "${FILES[@]}"
          SIGS=(); for f in "${FILES[@]}"; do SIGS+=("$f.sig"); done; FILES+=("${SIGS[@]}")
          pids=(); for f in "${FILES[@]}"; do gh release upload "$TAG" "$f" --clobber --repo "$GITHUB_REPOSITORY" & pids+=($!); done
          for p in "${pids[@]}"; do wait "$p"; done


  # Unsigned .ipa of the FULL edition for GitHub Releases (sideload via AltStore/Sideloadly).
  # The App Store build (FETCHJET_EDITION=store) is archived and uploaded from Xcode with
  # your signing identity; it is not produced here.
  build-ios-ipa:
    needs: plan
    if: needs.plan.outputs.ios == 'true'
    runs-on: ${{ vars.RUNNER_MACOS || 'macos-latest' }}
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Select Xcode
        # DEVELOPER_DIR instead of "sudo xcode-select": works on a self-hosted Mac too
        # (no password prompt) and only affects this job.
        run: |
          XCODE="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$XCODE/Contents/Developer" xcodebuild -version

      - name: Install native build tools (cmake, boost for libtorrent)
        # Already there on a self-hosted Mac after the first run: skip the reinstall.
        run: brew list cmake >/dev/null 2>&1 && brew list boost >/dev/null 2>&1 || brew install cmake boost

      # Python.xcframework (BeeWare) is downloaded and FJTorrent.xcframework is compiled from
      # source by scripts/ios-prepare-frameworks.sh. libtorrent takes ~20 min, so cache the result
      # keyed on the scripts that produce it.
      - name: Cache native frameworks
        id: native-cache
        uses: actions/cache@v4
        with:
          path: iosApp/Frameworks
          key: ios-native-frameworks-${{ runner.os }}-${{ hashFiles('scripts/ios-prepare-frameworks.sh', 'scripts/build-libtorrent-ios.command', 'iosApp/FJTorrent/**') }}

      - name: Prepare native frameworks (Python runtime + libtorrent)
        run: ./scripts/ios-prepare-frameworks.sh

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project iosApp/iosApp.xcodeproj -scheme iosApp -skipPackagePluginValidation

      - name: Build unsigned IPA (full edition)
        run: ./scripts/build-ios-ipa.sh full

      - name: Upload iOS to the draft release
        if: needs.plan.outputs.release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          TAG: v${{ needs.plan.outputs.version }}
        run: |
          shopt -s nullglob   # (no globstar: macOS ships bash 3.2)
          FILES=( build/ios/FetchJet-full.ipa )
          [ ${#FILES[@]} -gt 0 ] || { echo "::error::No iOS files were produced"; exit 1; }
          # Every file gets <file>.sig: the in-app updater installs only signed files.
          bash scripts/sign-release-file.sh "${FILES[@]}"
          SIGS=(); for f in "${FILES[@]}"; do SIGS+=("$f.sig"); done; FILES+=("${SIGS[@]}")
          pids=(); for f in "${FILES[@]}"; do gh release upload "$TAG" "$f" --clobber --repo "$GITHUB_REPOSITORY" & pids+=($!); done
          for p in "${pids[@]}"; do wait "$p"; done

      # On failure, print the end of the build logs here (no artifact: the storage quota
      # is too small for this account).
      - name: Show iOS build log (on failure)
        if: failure()
        run: |
          for f in build/*.errors.txt build/*.log; do
            [ -f "$f" ] || continue
            echo "::group::$f (last 150 lines)"; tail -n 150 "$f"; echo "::endgroup::"
          done
          grep -h -E "error:|\*\* (ARCHIVE|BUILD) FAILED" build/*.log 2>/dev/null | head -40 || true

  # Browser extension: Chrome/Edge zip + Firefox xpi. The Firefox file is signed on AMO when
  # the AMO_JWT_ISSUER / AMO_JWT_SECRET secrets exist (addons.mozilla.org -> Tools -> Manage API keys);
  # otherwise the unsigned xpi is uploaded (installable on Developer Edition / Nightly only).
  build-extension:
    needs: plan
    if: needs.plan.outputs.extension == 'true'
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    # The AMO keys live in the "release-build" environment with the other signing secrets.
    environment: release-build
    # `secrets` cannot be read inside a step `if:`; expose it as env and test that instead.
    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
      EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN }}
          fetch-depth: 0   # tags, to compare with the previous release

      # The stores only get a new version when extension/ changed since the previous
      # release tag; an app-only release leaves the store listing alone.
      - name: Did the extension change since the last release?
        id: ext
        run: |
          PREV=$(git tag --list 'v*' --sort=-v:refname | grep -vx "v${{ needs.plan.outputs.version }}" | head -1)
          if [ -z "$PREV" ] || ! git diff --quiet "$PREV" HEAD -- extension/; then
            echo "changed=true" >> "$GITHUB_OUTPUT"; echo "extension changed since ${PREV:-the start}"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "extension unchanged since $PREV: stores are not updated"
          fi

      # AMO refuses a version it has already signed, and Firefox only updates to a higher
      # one. So the extension keeps its own MAJOR.MINOR from manifest.json and the patch is
      # this workflow's run number: 3.0.0 in the manifest -> 3.0.57. Bump the manifest's
      # MAJOR.MINOR by hand for a big extension change.
      - name: Set the extension version
        run: |
          BASE=$(sed -n 's/.*"version": *"\([0-9]*\.[0-9]*\).*/\1/p' extension/manifest.json | head -1)
          EXT_VERSION="$BASE.${GITHUB_RUN_NUMBER}"
          echo "extension version $EXT_VERSION"
          sed -i -E 's/("version": *")[^"]*"/\1'"$EXT_VERSION"'"/' extension/manifest.json extension/manifest.firefox.json
          grep '"version"' extension/manifest.json extension/manifest.firefox.json

      - name: Package Chrome and Firefox builds
        run: ./extension/build.sh

      # Every release carries a signed .xpi of its own (unlisted = Mozilla signs it in minutes,
      # no review, nobody sees it on AMO). The app installs it when the store is behind the
      # version the app needs. Same add-on ID as the store listing, so it is one extension.
      - name: Sign the Firefox build unlisted (attached to the release)
        if: ${{ needs.plan.outputs.release == 'true' && env.AMO_JWT_ISSUER != '' }}
        run: |
          npx --yes web-ext@8 sign --channel unlisted \
            --source-dir build/extension/firefox --artifacts-dir build/extension/signed \
            --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"
          rm -f build/extension/*.xpi
          cp build/extension/signed/*.xpi build/extension/

      # Submits the new version to the public Firefox Add-ons store (listed). Mozilla reviews
      # it and Firefox users get the update by themselves. AMO signs a version number once, so
      # the store copy is <version>.1: higher than the unlisted one above, and once approved it
      # replaces it on its own.
      - name: Submit the Firefox version to addons.mozilla.org
        if: ${{ needs.plan.outputs.release == 'true' && steps.ext.outputs.changed == 'true' && env.AMO_JWT_ISSUER != '' && needs.plan.outputs.stores == 'true' }}
        run: |
          rm -rf build/extension/firefox-listed
          cp -r build/extension/firefox build/extension/firefox-listed
          sed -i -E 's/("version": *")([^"]*)"/\1\2.1"/' build/extension/firefox-listed/manifest.json
          grep '"version"' build/extension/firefox-listed/manifest.json
          npx --yes web-ext@8 sign --channel listed --approval-timeout 0 \
            --source-dir build/extension/firefox-listed --artifacts-dir build/extension/signed-listed \
            --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"

      # Same idea for Microsoft Edge Add-ons: the Chrome build is submitted for certification
      # and Edge users get updates from the store. Needs the EDGE_* secrets (Partner Center ->
      # Edge -> Publish API) and a first version submitted by hand.
      - name: Submit the Edge version to Microsoft Edge Add-ons
        if: ${{ needs.plan.outputs.release == 'true' && steps.ext.outputs.changed == 'true' && env.EDGE_PRODUCT_ID != '' && needs.plan.outputs.stores == 'true' }}
        uses: wdzeng/edge-addon@v2
        with:
          product-id: ${{ secrets.EDGE_PRODUCT_ID }}
          zip-path: build/extension/fetchjet-store-*.zip
          client-id: ${{ secrets.EDGE_CLIENT_ID }}
          api-key: ${{ secrets.EDGE_API_KEY }}
          notes-for-certification: >-
            The extension sends the link, cookies and referer only to the FetchJet desktop app on
            127.0.0.1:28450 so downloads that need a login work. <all_urls> is needed to show the
            download button on any site. No data leaves the computer. Source is not minified.

      - name: Upload extension to the draft release
        if: needs.plan.outputs.release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.plan.outputs.version }}
        run: |
          shopt -s nullglob   # (no globstar: macOS ships bash 3.2)
          # fetchjet-chrome-*.zip: developer-mode install (fixed key). fetchjet-store-*.zip: the
          # same build without the key, the file Edge Add-ons takes when it is submitted by hand.
          FILES=( build/extension/fetchjet-chrome-*.zip build/extension/fetchjet-store-*.zip build/extension/*.xpi )
          [ ${#FILES[@]} -gt 0 ] || { echo "::error::No extension files were produced"; exit 1; }
          # No <file>.sig here: the in-app updater never installs the extension (Firefox checks
          # Mozilla's own signature inside the .xpi, Chrome / Edge install from their stores).
          pids=(); for f in "${FILES[@]}"; do gh release upload "$TAG" "$f" --clobber --repo "$GITHUB_REPOSITORY" & pids+=($!); done
          for p in "${pids[@]}"; do wait "$p"; done


  release:
    needs: [ plan, build-android, build-desktop-linux, build-desktop-windows, build-desktop-macos, build-ios-ipa, build-extension ]
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    # Release mode, after every selected build succeeded (skipped platforms are fine).
    if: ${{ !cancelled() && needs.plan.outputs.release == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v${{ needs.plan.outputs.version }}
    steps:
      # Only the translated highlights (release-notes/<version>/<lang>.md) are needed here.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: release-notes
          sparse-checkout-cone-mode: true

      # The files are already in the draft (uploaded by each build job). Write the notes:
      # which platforms are in it, which are unchanged (read by the app and the downloads
      # page), then GitHub's list of changes since the previous release.
      - name: Write the release notes
        env:
          ANDROID: ${{ needs.plan.outputs.android }}
          WINDOWS: ${{ needs.plan.outputs.windows }}
          MACOS: ${{ needs.plan.outputs.macos }}
          LINUX: ${{ needs.plan.outputs.linux }}
          IOS: ${{ needs.plan.outputs.ios }}
          EXTENSION: ${{ needs.plan.outputs.extension }}
          BETA: ${{ needs.plan.outputs.beta }}
          NOTES_DIR: release-notes/${{ needs.plan.outputs.version }}
        run: |
          BUILT=""; UNCHANGED=""
          add() { if [ "$2" = "true" ]; then BUILT="${BUILT:+$BUILT, }$1"; else UNCHANGED="${UNCHANGED:+$UNCHANGED,}$1"; fi; }
          add android "$ANDROID"; add windows "$WINDOWS"; add macos "$MACOS"; add linux "$LINUX"; add ios "$IOS"; add extension "$EXTENSION"
          # Beta is not a GitHub "pre-release": the app asks /releases/latest, which skips those,
          # so users would never be offered the update. The beta platforms are a marker in the notes.
          TITLE="FetchJet $TAG"
          {
            if [ "$BETA" = "all" ] || echo ",$BETA," | grep -q ",all,"; then
              TITLE="$TITLE (Beta)"
              echo "<!-- fetchjet-beta: all -->"
              echo "**Beta release:** new features that are not fully tested yet. Please report problems."
              echo
            elif [ -n "$BETA" ]; then
              echo "<!-- fetchjet-beta: $BETA -->"
              echo "**Beta for:** $(echo "$BETA" | sed 's/,/, /g') (not fully tested yet; the other platforms are stable)."
              echo
            fi
            echo "**Platforms in this release:** $BUILT"
            if [ "$MACOS" = "true" ]; then
              echo
              echo "**macOS:** Apple Silicon (M1 or newer) only. Intel Macs are not supported."
              echo "Not notarized by Apple yet: if macOS says it \"could not verify FetchJet\", open System Settings > Privacy & Security and click Open Anyway (or run \`xattr -dr com.apple.quarantine /Applications/FetchJet.app\`)."
            fi
            if [ -n "$UNCHANGED" ]; then
              echo
              echo "<!-- fetchjet-unchanged: $UNCHANGED -->"
              echo "**Unchanged (not included):** $(echo "$UNCHANGED" | sed 's/,/, /g') — the latest build for these is in an earlier release; see the downloads page."
            fi
            echo
            if [ -f "$NOTES_DIR/en.md" ]; then cat "$NOTES_DIR/en.md"; echo; fi
            gh api -X POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$TAG" --jq .body 2>/dev/null || true
          } > notes.md
          cat notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes-file notes.md
          # The same notes as a file: the app reads it when the GitHub API is rate-limited
          # (the release web page drops the fetchjet-unchanged / fetchjet-beta markers).
          cp notes.md release-notes.md
          gh release upload "$TAG" release-notes.md --repo "$GITHUB_REPOSITORY" --clobber
          # The same highlights in the app's other languages (release-notes-<lang>.md): the
          # update dialog shows the one for the app's language, English when there is none.
          for f in "$NOTES_DIR"/*.md; do
            [ -f "$f" ] || continue
            lang=$(basename "$f" .md)
            [ "$lang" = "en" ] && continue
            { grep '^<!-- fetchjet-' notes.md || true; echo; cat "$f"; } > "release-notes-$lang.md"
            gh release upload "$TAG" "release-notes-$lang.md" --repo "$GITHUB_REPOSITORY" --clobber
          done
          echo "Draft ready: https://github.com/$GITHUB_REPOSITORY/releases"
