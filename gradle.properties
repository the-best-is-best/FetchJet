#Kotlin
kotlin.code.style=official
# Diagnostic logging in the built app (torrent peer statistics etc.). Errors are always
# logged. Overridden by the environment variable FETCHJET_VERBOSE_LOGS (used on GitHub
# Actions through the repository variable of the same name).
fetchjet.verboseLogs=false
kotlin.daemon.jvmargs=-Xmx6144M
#Gradle
org.gradle.jvmargs=-Xmx8192M -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.caching=true
#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
