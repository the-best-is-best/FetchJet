			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "set -e\n# Copies the Python standard library from Frameworks/Python.xcframework into the app\n# (python/lib/python3.X) and turns every extension module (.so) into a signed framework.\n# See Frameworks/Python.xcframework/build/utils.sh (BeeWare Python-Apple-support).\nXC=\"$PROJECT_DIR/Frameworks/Python.xcframework\"\nif [ ! -d \"$XC\" ]; then\n  echo \"error: $XC is missing. Download Python-3.13-iOS-support.bNN.tar.gz from https://github.com/beeware/Python-Apple-support/releases and extract Python.xcframework into iosApp/Frameworks/ (see CLAUDE_HANDOFF.md).\"\n  exit 1\nfi\n# Unsigned / simulator builds have no identity: ad-hoc sign the generated frameworks.\nif [ -z \"$(echo \"${EXPANDED_CODE_SIGN_IDENTITY:-}\" | tr -d '[:space:]')\" ]; then\n  export EXPANDED_CODE_SIGN_IDENTITY=\"-\"\n  export EXPANDED_CODE_SIGN_IDENTITY_NAME=\"ad-hoc\"\nfi\nsource \"$XC/build/utils.sh\"\n# curl_cffi (browser impersonation for yt-dlp): prebuilt payload fetched by \"Prepare Native\n# Frameworks\" into Frameworks/SwiftCurlCffi-iOS. site-packages-<platform> is copied to\n# FetchJet.app/python-packages and its .so modules are turned into frameworks like the stdlib.\nCC_RES=\"$PROJECT_DIR/Frameworks/SwiftCurlCffi-iOS/Sources/SwiftCurlCffiIOS/Resources\"\nCC_PY=$(sed -n 's/.*\"python\": *\"\\([0-9.]*\\)\".*/\\1/p' \"$CC_RES/manifest.json\" 2>/dev/null)\nAPP_PY=$(sed -n 's/^#define PY_VERSION[[:space:]]*\"\\([0-9]*\\.[0-9]*\\).*\"/\\1/p' \"$XC/ios-arm64/Python.framework/Headers/patchlevel.h\" | head -1)\nrm -rf \"$CODESIGNING_FOLDER_PATH/python-packages\"\nPKG_ARGS=\"\"\nif [ ! -f \"$CC_RES/curl_cffi_ios_payload.zip\" ]; then\n  echo \"note: curl_cffi payload not available (yt-dlp impersonation disabled)\"\nelif [ -n \"$CC_PY\" ] && [ -n \"$APP_PY\" ] && [ \"$CC_PY\" != \"$APP_PY\" ]; then\n  echo \"warning: curl_cffi payload is for Python $CC_PY, app embeds Python $APP_PY - skipping it (see scripts/ios-prepare-frameworks.sh)\"\nelse\n  CC_TMP=\"$DERIVED_FILE_DIR/curl_cffi_payload\"\n  rm -rf \"$CC_TMP\"; mkdir -p \"$CC_TMP\"\n  unzip -q -o \"$CC_RES/curl_cffi_ios_payload.zip\" -d \"$CC_TMP\"\n  CC_SRC=\"$CC_TMP/curl_cffi_ios_payload/site-packages-$PLATFORM_NAME\"\n  if [ -d \"$CC_SRC\" ]; then\n    echo \"Installing curl_cffi payload for $PLATFORM_NAME\"\n    mkdir -p \"$CODESIGNING_FOLDER_PATH/python-packages\"\n    rsync -a --exclude '__pycache__' \"$CC_SRC/\" \"$CODESIGNING_FOLDER_PATH/python-packages/\"\n    PKG_ARGS=\"python-packages\"\n  else\n    echo \"warning: curl_cffi payload has no site-packages-$PLATFORM_NAME - skipping\"\n  fi\nfi\ninstall_python Frameworks/Python.xcframework $PKG_ARGS\n";
